<svg width="100" height="100" viewBox="10 10 80 78" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 极柔和软阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    
    <!-- 棕色便签本封面渐变 -->
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4226" />
      <stop offset="100%" stop-color="#3A1F10" />
    </linearGradient>
    
    <!-- 奶白色露出的纸张渐变 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F0EAD6" />
    </linearGradient>
    
    <!-- 亚克力/云母半透明高光 -->
    <linearGradient id="acrylic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. 方形基底：棕色便签本/书（小圆角） -->
  <rect x="15" y="25" width="70" height="60" rx="8" fill="url(#brownGrad)" filter="url(#shadow)" />
  
  <!-- 左侧书脊（强化“书本/便签本”隐喻） -->
  <rect x="15" y="25" width="8" height="60" rx="4" fill="#2b1a0f" />

  <!-- 2. 从书中露出的黄色书签带（主色点缀） -->
  <rect x="65" y="15" width="6" height="25" fill="#FFD700" rx="2" />

  <!-- 3. 从书中露出的绿叶（已向右移动，简洁几何风格） -->
  <path d="M 60 25 Q 50 10 65 10 Q 75 20 60 25" fill="#2ECC71" />

  <!-- 4. 奶白色便签纸（从书中露出，关键识别元素） -->
  <rect x="20" y="15" width="60" height="65" rx="4" fill="url(#paperGrad)" filter="url(#shadow)" />

  <!-- 5. 便签小横条（代表书写区域） -->
  <line x1="30" y1="35" x2="70" y2="35" stroke="#D3C9B8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="30" y1="45" x2="60" y2="45" stroke="#D3C9B8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="30" y1="55" x2="65" y2="55" stroke="#D3C9B8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="30" y1="65" x2="50" y2="65" stroke="#D3C9B8" stroke-width="1.5" stroke-linecap="round" />

  <!-- 6. 右下角折角（更精准、自然） -->
  <!-- 折角下方深色阴影 -->
  <polygon points="62,80 80,62 80,80" fill="#3A1F10" opacity="0.3" />
  <!-- 折角本身（奶白色） -->
  <path d="M 80 80 L 62 80 L 80 62 Z" fill="url(#paperGrad)" />
  <!-- 折痕线 -->
  <line x1="62" y1="80" x2="80" y2="62" stroke="#D3C9B8" stroke-width="1.5" />

  <!-- 7. 亚克力半透明材质高光层（微质感） -->
  <rect x="20" y="15" width="60" height="65" rx="4" fill="url(#acrylic)" />
</svg>